# Production stack for apps.athenadecisions.com.
# Ports: backend 8040, frontend 3040 (distinct from golden-path 8020/3020,
# xcape 8030/3030).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8040}:8000"
    environment:
      ENVIRONMENT: production
      # Set on the host for natural-language "Guided" mode (Claude API).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADVENT_LLM_MODEL: ${ADVENT_LLM_MODEL:-claude-opus-5}
      ADVENT_SCENE_CACHE: /data/scene-cache
      ADVENT_SPRITE_CACHE: /data/sprite-cache
      ADVENT_COMPOSITE_CACHE: /data/composite-cache
    volumes:
      # Persist the image caches across restarts. scene-cache and sprite-cache
      # are pre-generated on a GPU/MPS box and rsynced up (see ./advent.sh sync);
      # composite-cache is derived on the server and can start empty.
      - ${ADVENT_SCENE_CACHE_HOST:-./scene-cache}:/data/scene-cache
      - ${ADVENT_SPRITE_CACHE_HOST:-./sprite-cache}:/data/sprite-cache
      - ${ADVENT_COMPOSITE_CACHE_HOST:-./composite-cache}:/data/composite-cache
    networks:
      - advent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        # Path-based under apps.athenadecisions.com/advent.
        VITE_BASE_PATH: ${ADVENT_BASE_PATH:-/advent/}
        VITE_API_BASE: ${ADVENT_API_BASE:-/advent/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3040}:80"
    depends_on:
      - backend
    networks:
      - advent-network

networks:
  advent-network:
    driver: bridge
