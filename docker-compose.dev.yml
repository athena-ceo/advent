#
# Local development stack. Source is mounted so code edits take effect on a
# container restart (the MCP server imports `advent` from the working dir).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8040}:8000"
    volumes:
      - ./backend:/app
    environment:
      ENVIRONMENT: development
    command: ["uvicorn", "advent.web:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - advent-network

networks:
  advent-network:
    driver: bridge
