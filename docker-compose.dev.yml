#
# Local full-stack run for Docker Desktop. Values come from a .env file in this
# directory (copy .env.example to .env). Open http://localhost:3040 -- the
# frontend proxies /api to the backend, so it is self-contained.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8040}:8000"
    environment:
      ENVIRONMENT: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADVENT_LLM_MODEL: ${ADVENT_LLM_MODEL:-claude-opus-5}
      ADVENT_SCENE_CACHE: /data/scene-cache
      ADVENT_SPRITE_CACHE: /data/sprite-cache
      ADVENT_COMPOSITE_CACHE: /data/composite-cache
      ADVENT_DB: /data/db/advent.db
      ADVENT_ADMIN_PASSWORD: ${ADVENT_ADMIN_PASSWORD:-}
    volumes:
      # Live-edit backend code, and persist the image caches (scene plates,
      # object sprites, composited results) and the players/games database.
      - ./backend:/app
      - ${ADVENT_SCENE_CACHE_HOST:-./scene-cache}:/data/scene-cache
      - ${ADVENT_SPRITE_CACHE_HOST:-./sprite-cache}:/data/sprite-cache
      - ${ADVENT_COMPOSITE_CACHE_HOST:-./composite-cache}:/data/composite-cache
      - advent-db:/data/db
    command: ["uvicorn", "advent.web:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - advent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_BASE_PATH: /
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3040}:80"
    depends_on:
      - backend
    networks:
      - advent-network

volumes:
  advent-db:

networks:
  advent-network:
    driver: bridge
