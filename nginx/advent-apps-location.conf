# Adventure -- path-based serving under https://apps.athenadecisions.com/advent
#
# HOW TO USE: paste these location blocks INSIDE the existing
#   server { server_name apps.athenadecisions.com; ... }
# block in /etc/nginx/sites-available/apps.athenadecisions.com, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Containers (docker-compose.server.yml): backend 8040 (frontend 3040 later).

    # Health probe.
    location = /advent/health {
        proxy_pass http://127.0.0.1:8040/health;
        proxy_set_header Host $host;
    }

    # MCP endpoint (Streamable HTTP + SSE). Trailing /mcp on proxy_pass strips
    # the /advent prefix: /advent/mcp -> http://127.0.0.1:8040/mcp.
    # SSE needs buffering off and long-lived connections.
    location ^~ /advent/mcp {
        proxy_pass http://127.0.0.1:8040/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        chunked_transfer_encoding on;
    }

