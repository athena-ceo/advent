# Adventure -- path-based serving under https://apps.athenadecisions.com/advent
#
# HOW TO USE: paste these location blocks INSIDE the existing
#   server { server_name apps.athenadecisions.com; ... }
# block in /etc/nginx/sites-available/apps.athenadecisions.com, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Containers (docker-compose.server.yml): backend 8040, frontend 3040.

    # Health probe.
    location = /advent/health {
        proxy_pass http://127.0.0.1:8040/health;
        proxy_set_header Host $host;
    }

    # REST API -> backend. ^~ so it wins over the SPA prefix. Trailing /api/ on
    # proxy_pass strips the /advent prefix: /advent/api/... -> :8040/api/...
    location ^~ /advent/api/ {
        proxy_pass http://127.0.0.1:8040/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chat mode calls the Claude API and can take a while.
        proxy_connect_timeout 180;
        proxy_read_timeout    180;
        proxy_send_timeout    180;
    }

    # Frontend SPA. Trailing slash strips /advent/ before the container, whose
    # nginx serves the static build and falls back to index.html.
    location ^~ /advent/ {
        proxy_pass http://127.0.0.1:3040/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /advent {
        return 301 /advent/;
    }
