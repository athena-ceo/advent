server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API to the backend service so the stack is self-contained
    # (no CORS locally). In the Athena deployment the outer nginx intercepts
    # /advent/api first, so this block is simply unused there.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Guided mode calls the Claude API and can take a while.
        proxy_connect_timeout 180;
        proxy_read_timeout    180;
        proxy_send_timeout    180;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
