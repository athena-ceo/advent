name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (with test deps)
        run: pip install -e "./backend[test]"
      - name: Run tests
        run: python -m pytest backend/tests -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build backend image
        run: docker build -t advent-backend ./backend
      - name: Run backend container
        run: |
          docker run -d --name advent -p 8040:8000 advent-backend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8040/health >/dev/null 2>&1; then
              echo "backend healthy"; break
            fi
            sleep 2
          done
      - name: Smoke test
        run: SMOKE_BASE_URL=http://localhost:8040 python scripts/smoke_test.py
      - name: Container logs on failure
        if: failure()
        run: docker logs advent || true
      - name: Tear down
        if: always()
        run: docker rm -f advent || true
